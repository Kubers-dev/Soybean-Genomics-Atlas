<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soybean Genomics Atlas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0 8px;
      width: 100%;
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================================================
       SOYBEAN ATLAS HEADER
       ========================================================= */
    .site-header {
      width: 100%;
      height: 450px;
      background: #000000;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 0;
    }

    .header-plant {
      width: 500px;
      height: 450px;
      flex: 0 0 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .header-plant img {
      display: block;
      width: 450px;
      height: 430px;
      object-fit: contain;
      object-position: center center;
      transform: translateX(0);
    }

    .header-divider {
      width: 2px;
      height: 315px;
      background: #8a8a8a;
      margin: 0 66px 0 22px;
      flex: 0 0 2px;
    }

    .header-text {
      min-width: 0;
      color: #ffffff;
      line-height: 1;
    }

    .header-title {
      margin: 0;
      font-size: 72px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .header-university {
      margin: 18px 0 0;
      font-size: 48px;
      line-height: 1.1;
      font-weight: 400;
      white-space: nowrap;
    }

    .main-content {
      min-height: calc(100vh - 450px);
      padding: 32px 24px;
      background: #ffffff;
    }

    .placeholder {
      margin: 0;
      font-size: 14px;
      color: #111111;
    }

  </style>
</head>

<body>
  <header class="site-header" aria-label="Soybean Genomics Atlas header">
    <div class="header-plant">
      <img
        src="images/soybean-real-plant.png?v=4"
        alt="Soybean plant"
      >
    </div>

    <div class="header-divider" aria-hidden="true"></div>

    <div class="header-text">
      <h1 class="header-title">Soybean Genomics Atlas</h1>
      <p class="header-university">Tennessee State University</p>
    </div>
  </header>

  <main class="main-content">
    <p class="placeholder">Website under development.</p>
  </main>
</body>
</html>
