<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Soybean Genomics Atlas</title>

  <style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff;
  color: #000000;
  font-family: Arial, Helvetica, sans-serif;
}

/* EXACT HEADER LAYOUT */
.site-header {
  width: 100%;
  height: 112px;
  background: #000000;
  display: flex;
  align-items: center;
  overflow: hidden;
  margin: 0;
  padding: 0;
}

.header-plant {
  width: 125px;
  height: 112px;
  flex: 0 0 125px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  overflow: visible;
  margin: 0;
  padding: 0;
}

.header-plant img {
  display: block;
  width: 125px;
  height: 112px;
  object-fit: contain;
  object-position: left center;
  margin: 0;
  padding: 0;
}

.header-divider {
  width: 1px;
  height: 82px;
  background: #777777;
  flex: 0 0 1px;
  margin-left: 19px;
  margin-right: 16px;
}

.header-text {
  color: #ffffff;
  margin: 0;
  padding: 0;
  line-height: 1;
}

.header-title {
  margin: 0;
  padding: 0;
  font-size: 30px;
  line-height: 1.1;
  font-weight: 700;
  white-space: nowrap;
}

.header-university {
  margin: 7px 0 0 0;
  padding: 0;
  font-size: 18px;
  line-height: 1.1;
  font-weight: 400;
  white-space: nowrap;
}

.main-content {
  min-height: calc(100vh - 112px);
  padding: 31px 20px;
  margin: 0;
  background: #ffffff;
}

.placeholder {
  margin: 0;
  padding: 0;
  font-size: 16px;
  color: #111111;
}
</style>
</head>


<body>

  <!-- =======================================================
       SOYBEAN GENOMICS ATLAS HEADER
       ======================================================= -->

  <header class="site-header">

    <div class="header-plant">
      <img
        src="images/soybean-real-plant.png"
        alt="Soybean plant"
      >
    </div>


    <div
      class="header-divider"
      aria-hidden="true">
    </div>


    <div class="header-text">

      <h1 class="header-title">
        Soybean Genomics Atlas
      </h1>

      <p class="header-university">
        Tennessee State University
      </p>

    </div>

  </header>


  <!-- =======================================================
       MAIN CONTENT
       ======================================================= -->

  <main class="main-content">

    <!-- =====================================================
         GENE EXPLORER
         ===================================================== -->

    <section class="gene-explorer">

      <h2>Gene Explorer</h2>

      <p class="gene-description">
        Search the soybean Wm82.a6.v1 genome by Gene ID.
      </p>

      <div class="gene-search">

        <input
          id="geneInput"
          type="text"
          placeholder="Enter Gene ID (e.g. Glyma.01G000100)"
          autocomplete="off"
        >

        <button id="geneSearchButton">
          Search
        </button>

      </div>

      <div id="geneMessage" class="gene-message"></div>

      <div id="geneResults" class="gene-results" hidden>

        <div class="gene-info">

          <h3>Gene Information</h3>

          <div class="info-grid">

            <div>
              <span>Gene ID</span>
              <strong id="resultGene"></strong>
            </div>

            <div>
              <span>Genome</span>
              <strong id="resultGenome"></strong>
            </div>

            <div>
              <span>Chromosome</span>
              <strong id="resultChromosome"></strong>
            </div>

            <div>
              <span>Gene Position</span>
              <strong id="resultPosition"></strong>
            </div>

            <div>
              <span>Strand</span>
              <strong id="resultStrand"></strong>
            </div>

          </div>

        </div>

        <div id="sequenceResults"></div>

      </div>

    </section>

  </main>


  <script src="js/gene-explorer.js"></script>

</body>
</html>
