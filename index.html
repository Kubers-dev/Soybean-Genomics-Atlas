<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soybean Genomics Atlas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0 8px;
      width: 100%;
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================================================
       SOYBEAN ATLAS HEADER
       ========================================================= */

    .site-header {
      width: 100% !important;
      height: 450px !important;
      min-height: 450px !important;
      background: #000 !important;
      display: flex !important;
      align-items: center !important;
      overflow: hidden !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .header-plant {
      width: 500px !important;
      height: 450px !important;
      min-width: 500px !important;
      flex: 0 0 500px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: visible !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .header-plant img {
      display: block !important;
      width: 450px !important;
      height: 430px !important;
      max-width: none !important;
      object-fit: contain !important;
      object-position: center center !important;
      transform: none !important;
      margin: 0 !important;
    }

    .header-divider {
      width: 2px !important;
      height: 315px !important;
      flex: 0 0 2px !important;
      background: #8a8a8a !important;
      margin: 0 55px 0 12px !important;
    }

    .header-text {
      color: #fff !important;
      min-width: 0 !important;
      line-height: 1 !important;
    }

    .header-title {
      margin: 0 !important;
      font-size: 72px !important;
      line-height: 1.12 !important;
      font-weight: 700 !important;
      white-space: nowrap !important;
    }

    .header-university {
      margin: 18px 0 0 !important;
      font-size: 48px !important;
      line-height: 1.1 !important;
      font-weight: 400 !important;
      white-space: nowrap !important;
    }

    .main-content {
      min-height: calc(100vh - 450px);
      padding: 32px 24px;
      background: #ffffff;
    }

    .placeholder {
      margin: 0;
      font-size: 14px;
      color: #111111;
    }

  </style>
</head>

<body>
  <header class="site-header" aria-label="Soybean Genomics Atlas header">
    <div class="header-plant">
      <img
        src="images/soybean-real-plant.png?v=4"
        alt="Soybean plant"
      >
    </div>

    <div class="header-divider" aria-hidden="true"></div>

    <div class="header-text">
      <h1 class="header-title">Soybean Genomics Atlas</h1>
      <p class="header-university">Tennessee State University</p>
    </div>
  </header>

  <main class="main-content">
    <p class="placeholder">Website under development.</p>
  </main>
</body>
</html>
