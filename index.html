<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soybean Genomics Atlas</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #000;
    }
    .site-header {
      width: 100%;
      height: 255px;
      background: #000 url("images/soybean-atlas-header-clear.png?v=1") center top / cover no-repeat;
      overflow: hidden;
    }
    .main-content {
      min-height: calc(100vh - 255px);
      padding: 50px 30px;
    }
    .placeholder { font-size: 18px; margin: 0; }
    @media (max-width: 900px) {
      .site-header { height: 180px; background-size: cover; background-position: center top; }
      .main-content { min-height: calc(100vh - 180px); padding: 28px 20px; }
    }
    @media (max-width: 520px) {
      .site-header { height: 140px; background-size: cover; background-position: center top; }
      .main-content { min-height: calc(100vh - 140px); padding: 22px 16px; }
    }
  </style>
</head>
<body>
  <header class="site-header" aria-label="Soybean Genomics Atlas header"></header>
  <main class="main-content">
    <p class="placeholder">Website under development.</p>
  </main>
</body>
</html>
