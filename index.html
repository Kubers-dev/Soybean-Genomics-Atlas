<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soybean Genomics Atlas</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #000000;
}

/* ================= HEADER ================= */

.site-header {
    height: 165px;
    width: 100%;
    background: #000000;
    color: #ffffff;

    display: flex;
    align-items: center;

    padding: 15px 30px;
}

/* Soybean illustration */

.soybean-area {
    width: 285px;
    height: 135px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.soybean-svg {
    width: 250px;
    height: 125px;
}

/* Divider */

.header-divider {
    width: 1px;
    height: 110px;
    background: #bdbdbd;
    margin: 0 30px;
}

/* Title */

.header-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.title {
    margin: 0;
    font-size: 38px;
    line-height: 1.15;
    font-weight: 700;
}

.university {
    margin-top: 8px;
    font-size: 21px;
    font-weight: 500;
}

/* ================= MAIN ================= */

.main-content {
    min-height: calc(100vh - 165px);
    padding: 38px 30px;
}

.placeholder {
    margin: 0;
    font-size: 16px;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .site-header {
        height: 120px;
        padding: 10px 15px;
    }

    .soybean-area {
        width: 150px;
        height: 100px;
    }

    .soybean-svg {
        width: 140px;
        height: 90px;
    }

    .header-divider {
        height: 80px;
        margin: 0 15px;
    }

    .title {
        font-size: 24px;
    }

    .university {
        font-size: 15px;
    }

    .main-content {
        padding: 25px 15px;
    }
}
</style>
</head>

<body>

<header class="site-header">

    <!-- SOYBEAN PLANT -->
    <div class="soybean-area">
        <img
            class="soybean-logo"
            src="images/soybean-real-plant.png?v=3"
            alt="Soybean plant"
        >
    </div>

    </div>

    <!-- DIVIDER -->
    <div class="header-divider"></div>

    <!-- TITLE -->
    <div class="header-text">
        <h1 class="title">Soybean Genomics Atlas</h1>
        <div class="university">Tennessee State University</div>
    </div>

</header>

<main class="main-content">
    <p class="placeholder">Website under development.</p>
</main>

</body>
</html>
