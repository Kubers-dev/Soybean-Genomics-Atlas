<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soybean Genomics Atlas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0 8px;
      width: 100%;
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================================================
       SOYBEAN ATLAS HEADER
       Matches the clean Chickpea Atlas header proportions:
       black banner, compact plant at left, clear title.
       ========================================================= */
    .site-header {
      width: 100%;
      height: 112px;
      background: #000000;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 0 8px;
    }

    .header-plant {
      width: 130px;
      height: 112px;
      flex: 0 0 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden; transform: translateX(-50px);
      margin-left: 35px;
    }

    .header-plant img {
      display: block;
      width: 120px;
      height: 108px;
      object-fit: contain;
      object-position: center center;
      transform: none;
      transform: translateX(-12px);
    }

    .header-divider {
      width: 1px;
      height: 72px;
      background: #8a8a8a;
      margin: 0 12px 0 4px;
      flex: 0 0 1px;
    }

    .header-text {
      min-width: 0;
      color: #ffffff;
      line-height: 1;
    }

    .header-title {
      margin: 0;
      font-size: 30px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .header-university {
      margin: 8px 0 0;
      font-size: 17px;
      line-height: 1.1;
      font-weight: 400;
      white-space: nowrap;
    }

    .main-content {
      min-height: calc(100vh - 112px);
      padding: 32px 24px;
      background: #ffffff;
    }

    .placeholder {
      margin: 0;
      font-size: 14px;
      color: #111111;
    }

    @media (max-width: 900px) {
      .site-header {
        height: 100px;
        padding: 0 18px;
      }

      .header-plant {
        width: 92px;
        height: 94px;
        flex-basis: 92px;
      }

      .header-plant img {
        width: 88px;
        height: 90px;
      }

      .header-divider {
        height: 64px;
        margin-left: 10px;
        margin-right: 18px;
      }

      .header-title {
        font-size: 25px;
      }

      .header-university {
        font-size: 15px;
        margin-top: 6px;
      }

      .main-content {
        min-height: calc(100vh - 100px);
        padding: 26px 18px;
      }
    }

    @media (max-width: 560px) {
      .site-header {
        height: 82px;
        padding: 0 10px;
      }

      .header-plant {
        width: 68px;
        height: 78px;
        flex-basis: 68px;
      }

      .header-plant img {
        width: 66px;
        height: 74px;
      }

      .header-divider {
        height: 52px;
        margin-left: 6px;
        margin-right: 12px;
      }

      .header-title {
        font-size: 19px;
      }

      .header-university {
        font-size: 12px;
        margin-top: 4px;
      }

      .main-content {
        min-height: calc(100vh - 82px);
        padding: 20px 12px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header" aria-label="Soybean Genomics Atlas header">
    <div class="header-plant">
      <img
        src="images/soybean-real-plant.png?v=4"
        alt="Soybean plant"
      >
    </div>

    <div class="header-divider" aria-hidden="true"></div>

    <div class="header-text">
      <h1 class="header-title">Soybean Genomics Atlas</h1>
      <p class="header-university">Tennessee State University</p>
    </div>
  </header>

  <main class="main-content">
    <p class="placeholder">Website under development.</p>
  </main>
</body>
</html>
